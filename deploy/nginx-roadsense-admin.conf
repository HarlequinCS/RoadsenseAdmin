# RoadSense Admin Dashboard — reverse proxy
# Domain: roadsense.saifuliqbal.dev
# Upstream: Docker container on 127.0.0.1:3010

upstream roadsense_admin {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name roadsense.saifuliqbal.dev;

    ssl_certificate /etc/letsencrypt/live/roadsense.saifuliqbal.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roadsense.saifuliqbal.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com https://*.cloudinary.com https://maps.googleapis.com https://maps.gstatic.com; connect-src 'self' https://*.googleapis.com https://identitytoolkit.googleapis.com https://firestore.googleapis.com https://api.groq.com wss://*.firebaseio.com https://*.cloudinary.com; frame-src 'self' https://www.google.com;" always;

    # Logging (isolated per project)
    access_log /var/log/nginx/roadsense-admin.access.log;
    error_log  /var/log/nginx/roadsense-admin.error.log;

    location / {
        proxy_pass http://roadsense_admin;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name roadsense.saifuliqbal.dev;

    return 301 https://$host$request_uri;
}
